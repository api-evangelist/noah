name: Noah
description: >-
  Noah (originally founded as Patch Homes in 2016 and rebranded to Noah in 2020)
  was a US-based home-equity investment fintech backed by Union Square Ventures.
  It offered homeowners up-front financing in exchange for a share of their home's
  future appreciation, as an interest-free, no-monthly-payment alternative to a
  HELOC or cash-out refinance. The company raised roughly $156M across five rounds
  from seven investors before ceasing operations in 2024. This record is retained
  in the API Evangelist network as a historical VC-portfolio lead; no live public
  API, developer portal, or documentation surface was found during enrichment.
